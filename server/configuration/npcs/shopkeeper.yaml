npc_shop:
  tree:
    start:
      dialog:
        - line: |
            <npc> says "welcome!"

    start_shopping:
      append_to: start
      options:
        - line: |
            ask about wares
          goto: shopping

    shopping:
      dialog:
        - line: |
            <npc> says "I got plenty to sell!"
        - line: |
            <npc> says "What can I get ya?"
        - line: |
            <npc> says "Need anything?"
      options:
        - line: |
            Buy one Stale Brew for 1 scrap
          goto: shopping
          trade:
            give_to_player:
              - item: custom_potion
                amount: 1
            give_to_npc:
              - item: currency_0
                amount: 1

        - line: |
            Buy one Green Potion for 10 scrap
          goto: shopping
          trade:
            give_to_player:
              - item: potion_hp_30
                amount: 1
            give_to_npc:
              - item: currency_0
                amount: 10

        - line: |
            Buy one Rope for 100 Scrap
          goto: shopping
          trade:
            give_to_player:
              - item: rope
                amount: 1
            give_to_npc:
              - item: currency_0
                amount: 100

        - line: |
            Buy one Letter for 10 Scrap
          goto: shopping
          trade:
            give_to_player:
              - item: letter
                amount: 1
            give_to_npc:
              - item: currency_0
                amount: 10

        - line: |
            Trade one Tree branch and three Slime for one Torch
          goto: shopping
          trade:
            give_to_player:
              - item: torch
                amount: 1
            give_to_npc:
              - item: tree_branch
                amount: 1
              - item: slime
                amount: 3

      







    learn_brewing:
      append_to: start
      options:
        - line: |
            ask "Why do you sell empty brews?"
          goto: learn_brewing2
          quest_start:
          - id: learn_brewing
          quest_check:
          - id: learn_brewing
            state: not_started
        - line: |
            ask "I got you some herbs"
          goto: learn_brewing3
          quest_check:
          - id: learn_brewing
            state: completed
          quest_turn_in:
          - id: learn_brewing
            reward_exp: 10
        - line: |
            ask about "brewing"
          goto: learn_brewing4
          quest_check:
          - id: learn_brewing
            state: turned_in
    learn_brewing2:
      dialog:
      - line: |
          <npc> says "Oh! empty brews are quiet useful. 
          You can mix your own brews using herbs! 
          Here is an idea, go get me some herbs...
          And I can teach you to brew!"   
    learn_brewing3:
      dialog:
      - line: |
          <npc> thanks you and demonstrates brewing,
          soon the mixture begins to glow. 

          "You can 'mix <brew> with <herb>' to create your own brews
          just like so!"
        
    learn_brewing4:
      dialog:
      - line: |
          "You can 'mix <brew> with <herb>' to create your own brews" says <npc>
      
          
